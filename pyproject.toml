[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "celerispath"
version = "0.1.0"
description = "Fast DAG and resource-constrained shortest paths for column-generation pricing (C++20/Boost core, Python API)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sharabh S", email = "shuklasharabh@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["shortest path", "DAG", "RCSP", "column generation", "pricing", "operations research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff"]

[project.urls]
Homepage = "https://github.com/sharabhshukla/CelerisPath"
Documentation = "https://sharabhshukla.github.io/CelerisPath/"
Repository = "https://github.com/sharabhshukla/CelerisPath"
Issues = "https://github.com/sharabhshukla/CelerisPath/issues"
Changelog = "https://github.com/sharabhshukla/CelerisPath/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = ["src/celerispath"]
# Everything not ignored by .gitignore goes into the sdist, minus the entries
# below. Do not add unanchored names such as "src" to sdist.include: they also
# match inside ignored directories (.venv/**/src) and override the ignore.
sdist.exclude = [
    "/.github", "/.gitignore", "/benchmarks/results", "/docs", "/mkdocs.yml",
    # Already ignored by .gitignore; repeated so that a secret or a virtual
    # environment can never end up in a release by accident.
    "/.env", "/.venv", "/.deps",
]

[tool.scikit-build.cmake.define]
CELERISPATH_BUILD_PYTHON = "ON"
CELERISPATH_BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Release wheels: no oneTBB (PricingFleet then runs on std::thread, which
# measured as fast), Boost headers from scripts/fetch_boost.py, and the test
# suite run against every wheel that is built.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
build-verbosity = 1
test-requires = ["pytest"]
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.config-settings]
"cmake.define.CELERISPATH_WITH_TBB" = "OFF"

[tool.cibuildwheel.linux]
# The project directory is mounted at /project inside the build container.
environment = { BOOST_ROOT = "/project/.deps/boost" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
