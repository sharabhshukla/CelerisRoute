site_name: CelerisPath
site_description: Fast shortest paths on state-space DAGs for column-generation pricing. C++20 core, Python API.
site_url: https://sharabhshukla.github.io/CelerisPath/
site_author: Sharabh S
repo_url: https://github.com/sharabhshukla/CelerisPath
repo_name: sharabhshukla/CelerisPath
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Sharabh S. Released under the MIT License.

theme:
  name: material
  icon:
    logo: material/vector-polyline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - User guide:
      - Modelling a network: guide/modelling.md
      - Resource limits: guide/resources.md
      - Pricing with duals: guide/pricing.md
      - Fleet pricing: guide/fleet.md
  - Examples:
      - examples/index.md
      - Your first shortest path: examples/shortest-path.md
      - Resource limits: examples/resource-limits.md
      - Vessel routing: examples/vessel-routing.md
      - Column generation: examples/column-generation.md
      - Fleet pricing: examples/fleet-pricing.md
  - Concepts:
      - Conventions and guarantees: concepts/guarantees.md
      - How it works: concepts/architecture.md
      - Limitations: concepts/limitations.md
  - Performance: performance.md
  - API reference:
      - reference/index.md
      - Modelling: reference/modelling.md
      - Solving: reference/solving.md
      - Pricing: reference/pricing.md
      - Fleet pricing: reference/fleet.md
      - Errors: reference/errors.md
  - Development:
      - Contributing: development/contributing.md
      - Releasing: development/releasing.md
      - Changelog: development/changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sharabhshukla/CelerisPath
    - icon: fontawesome/brands/python
      link: https://test.pypi.org/project/celerispath/
